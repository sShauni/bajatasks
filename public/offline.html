<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sem conexão</title>
<style>
  :root{--bg:#f5f6fa;--text:#0f172a;--muted:#64748b}
  @media (prefers-color-scheme:dark){:root{--bg:#0b0f17;--text:#e8ecf4;--muted:#8b97ad}}
  html,body{height:100%;margin:0}
  body{display:grid;place-items:center;background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;text-align:center;padding:16px}
  .logo{width:64px;height:64px;border-radius:18px;margin:0 auto 18px;background:linear-gradient(135deg,#fb923c,#ea580c)}
  h1{font-size:22px;margin:0 0 8px}p{color:var(--muted);margin:0 0 20px;line-height:1.5}
  a{display:inline-block;background:#f97316;color:#fff;font-weight:700;padding:12px 20px;border-radius:12px;text-decoration:none}
</style>
</head>
<body>
<div>
  <div class="logo"></div>
  <h1>Sem conexão com a internet</h1>
  <p>O Galpão Tasks precisa de internet para mostrar as tarefas atualizadas.<br>Confira o Wi-Fi ou os dados móveis.</p>
  <a href="/">Tentar de novo</a>
</div>
</body>
</html>
